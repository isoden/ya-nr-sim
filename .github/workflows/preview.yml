name: Preview

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, closed]

permissions:
  contents: read

concurrency:
  group: preview-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  CF_SEND_TELEMETRY: 'false'
  PREVIEW_NAME: pr-${{ github.event.pull_request.number }}

jobs:
  build:
    if: github.event.action != 'closed'
    uses: ./.github/workflows/build.yml

  preview:
    needs: build
    # fork からの PR は任意コードを secrets 付きで実行させないため対象外にする
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: client-build
          path: build/client
      - id: preview
        name: Deploy Preview
        run: |
          set -o pipefail
          output="$(npx cf previews deploy build/client --preview-name "$PREVIEW_NAME")"
          printf '%s\n' "$output"
          preview_url="$(printf '%s' "$output" | jq -er '.preview_urls[0]')"
          echo "preview_url=$preview_url" >> "$GITHUB_OUTPUT"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Comment Preview URL
        run: |
          gh pr comment "$PR_NUMBER" --edit-last --create-if-none --body "Preview: $PREVIEW_URL (commit $HEAD_SHA)"
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PREVIEW_URL: ${{ steps.preview.outputs.preview_url }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}

  cleanup:
    if: github.event.action == 'closed' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - run: npx cf previews delete "$PREVIEW_NAME" --worker ya-nr-sim --force
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
