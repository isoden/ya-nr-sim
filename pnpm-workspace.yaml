  - '@cloudflare/workerd-linux-arm64@1.20261116.1'
  - '@cloudflare/workerd-windows-64@1.20261116.1'
  - '@eslint-react/ast@5.30.3'
  - '@eslint-react/core@5.30.3'
  - '@eslint-react/eslint-plugin@5.30.3'
  - '@eslint-react/eslint@5.30.3'
  - '@eslint-react/jsx@5.30.3'
